services:
  app:
    build: .
    expose:
      - "3000"
    volumes:
      - sqlite-data:/app/data
    environment:
      - SERVICE_FQDN_APP_3000
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/tokens.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  sqlite-data:
