services:
  app:
    build: .
    expose:
      - "3000"
    volumes:
      - sqlite-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/tokens.db
      - NATIONBUILDER_CLIENT_ID=${NATIONBUILDER_CLIENT_ID}
      - NATIONBUILDER_CLIENT_SECRET=${NATIONBUILDER_CLIENT_SECRET}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - "traefik.http.routers.membership-http.rule=Host(`membership.cargobay.dev`)"
      - traefik.http.routers.membership-http.entrypoints=http
      - traefik.http.routers.membership-http.middlewares=redirect-to-https
      - "traefik.http.routers.membership.rule=Host(`membership.cargobay.dev`)"
      - traefik.http.routers.membership.entrypoints=https
      - traefik.http.routers.membership.tls=true
      - traefik.http.routers.membership.tls.certresolver=letsencrypt
      - traefik.http.services.membership.loadbalancer.server.port=3000
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https

volumes:
  sqlite-data:

networks:
  coolify:
    external: true
